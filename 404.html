<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11151d">
  <title>Page Not Found | Stackly</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#11151d;color:#f4f6fa;font:16px/1.6 'DM Sans',Arial,sans-serif}.error{width:min(100%,680px)}.code{margin:0;color:#b6e936;font-size:13px;font-weight:700;letter-spacing:2px}.error h1{max-width:560px;margin:16px 0;font-size:clamp(34px,7vw,58px);line-height:1.05}.error p{max-width:500px;color:#bac2ce}.error a{display:inline-flex;align-items:center;min-height:46px;margin-top:16px;padding:0 18px;background:#b6e936;color:#11151d;font-weight:700;text-decoration:none;border-radius:5px}
  </style>
</head>
<body>
  <main class="error">
    <p class="code">ERROR 404</p>
    <h1>That page is not available.</h1>
    <p>The destination you requested could not be found.</p>
    <a href="index.html">Return home</a>
  </main>
</body>
</html>
