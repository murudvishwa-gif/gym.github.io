<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11151d">
  <title>Page Not Found | Stackly</title>
  <link rel="stylesheet" href="responsive.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#11151d;color:#f4f6fa;font:16px/1.6 'DM Sans',Arial,sans-serif}.error{width:min(100%,680px)}.code{margin:0;color:#b6e936;font-size:clamp(20px,4vw,28px);font-weight:700;letter-spacing:3px}.error h1{max-width:560px;margin:16px 0;font-size:clamp(34px,7vw,58px);line-height:1.05}.error p{max-width:500px;color:#bac2ce}.error a{display:inline-flex;align-items:center;min-height:46px;margin:16px 12px 0 0;padding:0 18px;background:#b6e936;color:#11151d;font-weight:700;text-decoration:none;border-radius:5px}.error a.back{background:transparent;border:1px solid #b6e936;color:#b6e936}
  </style>
</head>
<body>
  <main class="error">
    <p class="code">ERROR 404</p>
    <h1>That page is not available.</h1>
    <p>The destination you requested could not be found.</p>
    <a class="back" href="javascript:history.back()">Go back</a>
    <a href="index.html">Return home</a>
  </main>
  <script>
    const returnTarget = sessionStorage.getItem('dashboard-return');
    const backLink = document.querySelector('.error a.back');
    if (returnTarget && new URLSearchParams(location.search).has('from')) {
      backLink.href = returnTarget;
      backLink.removeAttribute('onclick');
      sessionStorage.removeItem('dashboard-return');
    }
  </script>
</body>
</html>
